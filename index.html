<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Did We Gave Up?</title>
    <style>
        body {
            background-color: orange;
            color: #fff;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
        }

        .image-placeholder {
            width: 320px;
            height: 320px;
            background-color: orange;
            border: 2px dashed #ff6a00;
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .headline {
            font-size: 40px;
            color: black;
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px #ff6a00aa;
        }

        .subline {
            font-size: 18px;
            color: #fff;
            font-style: italic;
            margin-bottom: 25px;
        }

        .quote {
            font-size: 17px;
            margin: 8px 0;
            color: black;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 30px;
            background-color: #ff6a00;
            color: #000;
            font-weight: bold;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 0 10px #ff6a00;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #ff8533;
            box-shadow: 0 0 20px #ff8533;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="image-placeholder">
            <img src="./gave.png" alt="Meme Guru">
        </div>
        <h1 class="headline">Did We Gave Up?</h1>
        <h2 class="subline">💀📉 Rugged? Maybe. But never defeated.</h2>

        <p class="quote">“Bro this was the next PEPE.”</p>
        <p class="quote">“Floor is fud. We're flying soon.”</p>
        <p class="quote">“It’s only down 98%, still early.”</p>
        <p class="quote">“Charts are temporary, memes are forever.”</p>
        <p class="quote">“One more pump and I'm out fr.”</p>

        <a class="btn" href="https://pump.fun" target="_blank" rel="noopener">Launch Degens on Pump.fun</a>
    </div>
</body>

</html>
